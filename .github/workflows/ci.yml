name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:8.2-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      TEST_REDIS_URL: redis://127.0.0.1:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e '.[dev]'
      - run: ruff check .
      - run: pytest -q
      - run: docker compose config --quiet
      - name: Validate Kubernetes YAML
        run: python -c "from pathlib import Path; import yaml; docs=sum((list(yaml.safe_load_all(p.read_text())) for p in Path('deploy/kubernetes').glob('*.yaml')), []); assert all(isinstance(d, dict) for d in docs)"

  docker-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: sh scripts/test_docker_stack.sh
      - run: sh scripts/test_proactive_stack.sh
