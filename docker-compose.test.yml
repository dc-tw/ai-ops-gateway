services:
  gateway:
    build:
      args:
        INSTALL_BROWSER: "false"
    environment:
      LLM_BASE_URL: http://mock-llm:8080/v1
      LLM_API_KEY: test-only
      LLM_MODEL: mock-model
      LLM_INPUT_COST_PER_MILLION: "2"
      LLM_OUTPUT_COST_PER_MILLION: "8"
      CONVERSATION_MAX_TURNS: "2"
      ATR_ENABLED: ${ATR_ENABLED:-true}
      ATR_BLOCKING: ${ATR_BLOCKING:-false}
      AUTOMATION_WEBHOOK_SECRETS_JSON: ${AUTOMATION_WEBHOOK_SECRETS_JSON:-}

  browser:
    build:
      args:
        INSTALL_BROWSER: "false"

  worker:
    environment:
      GOAL_LEASE_MS: "5000"
      LLM_BASE_URL: http://mock-llm:8080/v1
      LLM_API_KEY: test-only
      LLM_MODEL: mock-model
      LLM_INPUT_COST_PER_MILLION: "2"
      LLM_OUTPUT_COST_PER_MILLION: "8"
      PLAYWRIGHT_ALLOWED_DOMAINS: example.com
      CONVERSATION_MAX_TURNS: "2"
      ATR_ENABLED: ${ATR_ENABLED:-true}
      ATR_BLOCKING: ${ATR_BLOCKING:-false}
    depends_on:
      mock-llm:
        condition: service_healthy

  scheduler:
    environment:
      LLM_BASE_URL: http://mock-llm:8080/v1
      LLM_API_KEY: test-only
      LLM_MODEL: mock-model
      AUTOMATION_POLL_SECONDS: "0.2"

  mock-llm:
    build:
      context: tests/docker/mock-llm
    networks: [backend]
