apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: browser-worker-ingress
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: browser
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - key: app.kubernetes.io/component
                operator: In
                values: [gateway, worker]
      ports:
        - {protocol: TCP, port: 8010}
