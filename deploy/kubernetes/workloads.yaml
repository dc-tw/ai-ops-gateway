apiVersion: v1
kind: Service
metadata:
  name: ai-ops-gateway
spec:
  selector:
    app.kubernetes.io/name: ai-ops-gateway
    app.kubernetes.io/component: gateway
  ports:
    - name: http
      port: 8000
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-ops-gateway
spec:
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: ai-ops-gateway
      app.kubernetes.io/component: gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ai-ops-gateway
        app.kubernetes.io/component: gateway
    spec:
      automountServiceAccountToken: false
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/component: gateway
      containers:
        - name: gateway
          image: ghcr.io/YOUR_ORG/ai-ops-gateway:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: ai-ops-gateway-config
            - secretRef:
                name: ai-ops-gateway-secrets
          readinessProbe:
            httpGet: {path: /readyz, port: http}
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 15
            failureThreshold: 3
          resources:
            requests: {cpu: 250m, memory: 384Mi}
            limits: {cpu: "2", memory: 2Gi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities: {drop: ["ALL"]}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-ops-goal-worker
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: ai-ops-gateway
      app.kubernetes.io/component: worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ai-ops-gateway
        app.kubernetes.io/component: worker
    spec:
      automountServiceAccountToken: false
      containers:
        - name: worker
          image: ghcr.io/YOUR_ORG/ai-ops-gateway:0.1.0
          command: ["python", "-m", "app.worker"]
          envFrom:
            - configMapRef: {name: ai-ops-gateway-config}
            - secretRef: {name: ai-ops-gateway-secrets}
          resources:
            requests: {cpu: 250m, memory: 384Mi}
            limits: {cpu: "2", memory: 2Gi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities: {drop: ["ALL"]}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: browser-worker
spec:
  sessionAffinity: ClientIP
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: 1800
  selector:
    app.kubernetes.io/name: ai-ops-gateway
    app.kubernetes.io/component: browser
  ports:
    - name: http
      port: 8010
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: browser-worker
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: ai-ops-gateway
      app.kubernetes.io/component: browser
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ai-ops-gateway
        app.kubernetes.io/component: browser
    spec:
      automountServiceAccountToken: false
      containers:
        - name: browser
          image: ghcr.io/YOUR_ORG/ai-ops-browser:0.1.0
          command: ["uvicorn", "app.browser_worker:app", "--host", "0.0.0.0", "--port", "8010"]
          ports:
            - {name: http, containerPort: 8010}
          envFrom:
            - configMapRef: {name: ai-ops-gateway-config}
            - secretRef: {name: ai-ops-gateway-secrets}
          readinessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 5
          resources:
            requests: {cpu: 500m, memory: 768Mi}
            limits: {cpu: "2", memory: 2Gi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities: {drop: ["ALL"]}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
            - {name: shm, mountPath: /dev/shm}
      volumes:
        - name: tmp
          emptyDir: {}
        - name: shm
          emptyDir: {medium: Memory, sizeLimit: 1Gi}
