apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: ai-ops-gateway
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app.kubernetes.io/component: gateway
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: browser-worker
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: browser
