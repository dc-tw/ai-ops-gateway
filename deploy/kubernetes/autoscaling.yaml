apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ai-ops-gateway
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: ai-ops-gateway}
  minReplicas: 3
  maxReplicas: 12
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: {type: Utilization, averageUtilization: 65}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: browser-worker
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: browser-worker}
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: {type: Utilization, averageUtilization: 60}
