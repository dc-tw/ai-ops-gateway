# Opt-in managed-PostgreSQL migration and history projector. No in-cluster DB.
# Apply the migration Job and wait for completion before rolling out the projector.
apiVersion: batch/v1
kind: Job
metadata:
  name: ai-ops-postgres-migrate
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 300
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ai-ops-gateway
        app.kubernetes.io/component: postgres-migrate
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      containers:
        - name: migrate
          image: ghcr.io/YOUR_ORG/ai-ops-gateway:0.1.0
          command: ["python", "-m", "app.postgres_worker", "migrate"]
          envFrom:
            - configMapRef: {name: ai-ops-gateway-config}
            - secretRef: {name: ai-ops-gateway-secrets}
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: "1", memory: 512Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities: {drop: ["ALL"]}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-ops-postgres-projector
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: ai-ops-gateway
      app.kubernetes.io/component: postgres-projector
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ai-ops-gateway
        app.kubernetes.io/component: postgres-projector
    spec:
      automountServiceAccountToken: false
      containers:
        - name: projector
          image: ghcr.io/YOUR_ORG/ai-ops-gateway:0.1.0
          command: ["python", "-m", "app.postgres_worker", "project"]
          envFrom:
            - configMapRef: {name: ai-ops-gateway-config}
            - secretRef: {name: ai-ops-gateway-secrets}
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: "1", memory: 512Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities: {drop: ["ALL"]}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: tmp
          emptyDir: {}
