apiVersion: v1
kind: Secret
metadata:
  name: ai-ops-gateway-secrets
type: Opaque
stringData:
  # Replace these examples through External Secrets, Vault, or your cloud secret manager.
  REDIS_URL: rediss://user:password@managed-redis.example:6379/0
  LLM_BASE_URL: https://inference.internal.example/v1
  LLM_API_KEY: replace-me
  API_KEYS_JSON: '{"replace-me":{"subject":"admin","tenant_id":"default","role":"admin"}}'
  BROWSER_WORKER_TOKEN: replace-me-with-a-random-token
